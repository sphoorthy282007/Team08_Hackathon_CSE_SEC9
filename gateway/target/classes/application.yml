server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**, /api/users/**, /api/teams/**
        - id: task-service
          uri: lb://TASK-SERVICE
          predicates:
            - Path=/api/tasks/**
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/reviews/**
        - id: dispute-service
          uri: lb://DISPUTE-SERVICE
          predicates:
            - Path=/api/disputes/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
