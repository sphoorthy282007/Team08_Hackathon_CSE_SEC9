server:
  port: 8082

spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://localhost:5432/teamfair_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
